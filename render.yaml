services:
  - type: web
    name: gorunners-api
    env: python
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GORUNNERS_SECRET
        generateValue: true
      # Configure MySQL in Render dashboard with either:
      # 1) GORUNNERS_DB=mysql+pymysql://user:password@host:3306/gorunners?charset=utf8mb4
      # 2) MYSQL_HOST / MYSQL_PORT / MYSQL_USER / MYSQL_PASSWORD / MYSQL_DATABASE
